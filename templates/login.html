{% extends 'base.html' %}
{% block title %}Connexion — Supervision Réseau{% endblock %}

{% block content %}
<div class="card shadow-lg border-0" style="width:420px;max-width:95vw;">
    <div class="card-body p-5">
        <div class="text-center mb-4">
            <i class="bi bi-diagram-3-fill text-primary" style="font-size:3rem;"></i>
            <h4 class="fw-bold mt-2 text-dark">Supervision Réseau</h4>
            <p class="text-muted small">Connectez-vous pour accéder au tableau de bord</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold text-dark">Adresse e-mail</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-envelope text-muted"></i>
                    </span>
                    <input type="email" id="email" name="email" class="form-control border-start-0"
                           placeholder="admin@supervision.local" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-dark">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control border-start-0"
                           placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
            </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
            <i class="bi bi-shield-lock me-1"></i>
            Accès réservé aux administrateurs réseau
        </p>
    </div>
</div>
{% endblock %}
