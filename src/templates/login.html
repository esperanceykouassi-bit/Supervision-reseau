{% extends "base.html" %}
{% block titre %}Connexion — Supervision Réseau{% endblock %}
{% block contenu %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="text-center mb-4"><i class="bi bi-hdd-network"></i> SupervisionNet</h3>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Identifiant</label>
            <input type="text" name="identifiant" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="mot_de_passe" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Se connecter
          </button>
        </form>
        <p class="text-muted text-center mt-3 small">Identifiants par défaut : admin / admin123</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
