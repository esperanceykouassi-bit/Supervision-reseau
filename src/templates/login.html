{% extends "base.html" %}
{% block titre %}Connexion — Awali{% endblock %}
{% block contenu %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='img/logo-awali.png') }}" alt="Awali"
               style="max-height:110px;" class="mb-2" onerror="this.style.display='none'">
          <h3 class="mb-0 fw-bold" style="color:#1B3A5C;">Awali</h3>
          <p class="text-muted small mb-0">Surveille. Alerte. Anticipe.</p>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Identifiant</label>
            <input type="text" name="identifiant" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="mot_de_passe" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Se connecter
          </button>
        </form>
        <p class="text-muted text-center mt-3 small">Identifiants par défaut : admin / admin123</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
